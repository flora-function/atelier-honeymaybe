<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>honeymaybe admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <main>
    <h1>atelier honeymaybe · admin</h1>

    <section id="login" hidden>
      <form id="login-form">
        <label>Admin token <input type="password" id="token" required autocomplete="current-password" /></label>
        <button>log in</button>
        <p class="err" id="login-err"></p>
      </form>
    </section>

    <div id="app" hidden>
      <p class="bar"><button id="logout" class="ghost">log out</button></p>

      <section>
        <h2 id="form-title">upload new art</h2>
        <form id="art-form">
          <label>Image <input type="file" id="image" accept="image/jpeg,image/png,image/webp,image/gif" /></label>
          <img id="preview" alt="" hidden />
          <label>Title <input id="title" required /></label>
          <div class="row">
            <label>Date <input id="date" placeholder="2026-11" pattern="\d{4}-\d{2}" required /></label>
            <label>Medium <input id="medium" placeholder="watercolour" required /></label>
          </div>
          <label>Tags (comma separated) <input id="tags" placeholder="nature, insects" /></label>
          <label>Description <textarea id="description" rows="3"></textarea></label>
          <label class="check"><input type="checkbox" id="featured" /> featured</label>
          <div class="row">
            <button id="submit">upload</button>
            <button type="button" id="cancel" class="ghost" hidden>cancel edit</button>
          </div>
          <p id="msg"></p>
        </form>
      </section>

      <section>
        <h2>all art <span id="count"></span></h2>
        <ul id="list"></ul>
      </section>
    </div>
  </main>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
